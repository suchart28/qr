<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/gh/ushelp/EasyQRCode-JS@master/dist/easy.qrcode.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-group {
            display: grid;
            gap: 10px;
        }

        button {
            font-family: 'Chakra Petch', sans-serif;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 15px;
        }

        .btn-generate {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-generate:hover { background: var(--secondary); }

        .download-options {
            display: none; /* ซ่อนจนกว่าจะสร้างสำเร็จ */
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-png { background: #10b981; color: white; }
        .btn-svg { background: #f59e0b; color: white; }
        
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin: 20px auto;
            display: none; /* ซ่อนจนกว่าจะสร้างสำเร็จ */
            width: fit-content;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>QR Code Gen Pro</h1>
        <p>สร้าง QR Code แบบไม่มีโฆษณา ไม่มีหมดอายุ</p>
        
        <input type="text" id="textInput" placeholder="กรอก URL หรือ ข้อความที่นี่..." onkeydown="if(event.key === 'Enter') generateQR()">
        
        <button class="btn-generate" onclick="generateQR()">🚀 สร้าง QR Code</button>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <div class="download-options" id="downloadGroup">
            <button class="btn-png" onclick="downloadPNG()">🖼️ เซฟ PNG (2000px)</button>
            <button class="btn-svg" onclick="downloadSVG()">📐 เซฟ SVG (Vector)</button>
        </div>
    </div>

    <div class="footer">Powered by Suchart Prommee</div>

    <script>
        let qrInstance = null;

        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const container = document.getElementById('qrcode-container');
            const display = document.getElementById('qrcode');
            const downloadGroup = document.getElementById('downloadGroup');

            if (!text) {
                alert('กรุณาพิมพ์ข้อความก่อนครับ');
                return;
            }

            // ล้างค่าเก่า
            display.innerHTML = '';
            container.style.display = 'block';
            downloadGroup.style.display = 'grid';

            // สร้าง QR Code สำหรับ Preview บนหน้าจอ (ขนาดเล็ก)
            qrInstance = new QRCode(display, {
                text: text,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // ฟังก์ชันดาวน์โหลด PNG ขนาดใหญ่ (2000px)
        function downloadPNG() {
            const text = document.getElementById('textInput').value;
            const tempDiv = document.createElement('div');
            
            // สร้าง QR Code แบบ High-res ใน Memory (ไม่แสดงบนจอ)
            new QRCode(tempDiv, {
                text: text,
                width: 2000,
                height: 2000,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H,
                onRenderingEnd: function(options, dataURL) {
                    const link = document.createElement('a');
                    link.download = 'qrcode-high-res.png';
                    link.href = dataURL;
                    link.click();
                }
            });
        }

        // ฟังก์ชันดาวน์โหลดเป็น SVG
        function downloadSVG() {
            const text = document.getElementById('textInput').value;
            const tempDiv = document.createElement('div');

            // ใช้โหมด useSVG: true
            new QRCode(tempDiv, {
                text: text,
                width: 500,
                height: 500,
                useSVG: true,
                correctLevel: QRCode.CorrectLevel.H,
                onRenderingEnd: function(options, dataURL) {
                    const svgElement = tempDiv.querySelector('svg');
                    const svgData = new XMLSerializer().serializeToString(svgElement);
                    const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
                    const url = URL.createObjectURL(svgBlob);
                    
                    const link = document.createElement('a');
                    link.download = 'qrcode.svg';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                }
            });
        }
    </script>
</body>
</html>
