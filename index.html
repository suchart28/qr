<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR & URL Shortener</title>
    
    <!-- นำเข้า Google Fonts: Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- นำเข้า EasyQRCodeJS -->
    <script src="https://unpkg.com/easyqrcodejs/dist/easy.qrcode.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
            --btn-shorten: #0ea5e9;
            --btn-shorten-hover: #0284c7;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            font-family: 'Chakra Petch', sans-serif;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 16px;
            width: 100%;
        }

        .btn-shorten { background: var(--btn-shorten); color: white; }
        .btn-shorten:hover:not(:disabled) { background: var(--btn-shorten-hover); transform: translateY(-1px); }
        .btn-shorten:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-generate { background: var(--primary); color: white; }
        .btn-generate:hover { background: var(--secondary); transform: translateY(-1px); }

        /* ส่วนแสดงผลลิงก์ที่ย่อแล้ว */
        #shortUrlResult {
            display: none;
            background: #0f172a;
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        #shortUrlResult span {
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
        }

        .btn-copy {
            background: #334155;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
            border-radius: 6px;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .btn-copy:hover { background: #475569; }

        .download-options {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-png { background: var(--accent); color: white; }
        .btn-svg { background: #f59e0b; color: white; }
        .download-options button:hover { opacity: 0.9; transform: translateY(-1px); }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin: 0 auto;
            display: none;
            width: fit-content;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Link & QR</h1>
        <p class="subtitle">เครื่องมือย่อลิงก์ และสร้าง QR Code ในที่เดียว</p>
        
        <input type="text" id="textInput" placeholder="วาง URL ยืดๆ ของคุณที่นี่..." onkeydown="if(event.key === 'Enter') generateQR()">
        
        <!-- กล่องแสดงผลเมื่อย่อลิงก์สำเร็จ -->
        <div id="shortUrlResult">
            <span id="shortenedLink"></span>
            <button class="btn-copy" onclick="copyToClipboard()">📋 คัดลอก</button>
        </div>

        <div class="action-group">
            <button id="shortenBtn" class="btn-shorten" onclick="shortenURL()">✂️ ย่อลิงก์</button>
            <button class="btn-generate" onclick="generateQR()">🚀 สร้าง QR Code</button>
        </div>

        <!-- ส่วนแสดงผลภาพ QR -->
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <!-- ปุ่มดาวน์โหลด -->
        <div class="download-options" id="downloadGroup">
            <button class="btn-png" onclick="downloadPNG()">🖼️ เซฟ PNG (2000px)</button>
            <button class="btn-svg" onclick="downloadSVG()">📐 เซฟ SVG (Vector)</button>
        </div>
    </div>

    <div class="footer">Powered by EasyQRCodeJS & TinyURL API</div>

    <script>
        // ฟังก์ชันย่อลิงก์
        async function shortenURL() {
            let textInput = document.getElementById('textInput');
            let text = textInput.value.trim();
            const shortenBtn = document.getElementById('shortenBtn');
            const resultBox = document.getElementById('shortUrlResult');
            const linkSpan = document.getElementById('shortenedLink');

            if (!text) {
                alert('กรุณาวาง URL ที่ต้องการย่อก่อนครับ');
                return;
            }

            // เช็คว่าเป็น URL เบื้องต้นหรือไม่
            if (!text.includes('.')) {
                alert('ดูเหมือนข้อความนี้จะไม่ใช่ URL นะครับ กรุณาตรวจสอบอีกครั้ง');
                return;
            }

            // เติม http:// ถ้าไม่มี
            if (!text.startsWith('http://') && !text.startsWith('https://')) {
                text = 'https://' + text;
                textInput.value = text;
            }

            try {
                shortenBtn.innerText = "⏳ กำลังย่อ...";
                shortenBtn.disabled = true;

                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(text)}`);
                
                if (response.ok) {
                    const shortUrl = await response.text();
                    
                    // นำลิงก์สั้นที่ได้ ไปแทนที่ในช่องกรอกข้อความ
                    textInput.value = shortUrl;
                    
                    // แสดงกล่องคัดลอกลิงก์
                    linkSpan.innerText = shortUrl;
                    resultBox.style.display = "flex";
                } else {
                    alert("เกิดข้อผิดพลาดจากระบบย่อลิงก์ครับ");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("ไม่สามารถเชื่อมต่อระบบย่อลิงก์ได้ครับ");
            } finally {
                shortenBtn.innerText = "✂️ ย่อลิงก์";
                shortenBtn.disabled = false;
            }
        }

        // ฟังก์ชันคัดลอกลิงก์สั้น
        function copyToClipboard() {
            const shortUrl = document.getElementById('shortenedLink').innerText;
            navigator.clipboard.writeText(shortUrl).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ คัดลอกแล้ว!";
                btn.style.background = "#10b981";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "#334155";
                }, 2000);
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }

        // ฟังก์ชันสร้าง QR Code
        function generateQR() {
            const text = document.getElementById('textInput').value.trim();
            const container = document.getElementById('qrcode-container');
            const display = document.getElementById('qrcode');
            const downloadGroup = document.getElementById('downloadGroup');

            if (!text) {
                alert('กรุณาพิมพ์ข้อความหรือ URL ก่อนครับ');
                return;
            }

            // ล้างภาพเก่า
            display.innerHTML = '';
            
            // แสดงหน้าต่าง Preview
            container.style.display = 'block';
            downloadGroup.style.display = 'grid';

            // สร้าง QR Code ขนาดปกติ
            new QRCode(display, {
                text: text, // ใช้ข้อความจากช่องกรอก ณ ปัจจุบัน (ซึ่งอาจจะถูกย่อมาแล้ว)
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadPNG() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;
            const tempDiv = document.createElement('div');
            
            new QRCode(tempDiv, {
                text: text,
                width: 2000,
                height: 2000,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const canvas = tempDiv.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'qrcode-high-res.png';
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                } else {
                    alert('ไม่สามารถสร้างไฟล์ PNG ได้');
                }
            }, 300);
        }

        function downloadSVG() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;
            const tempDiv = document.createElement('div');

            new QRCode(tempDiv, {
                text: text,
                width: 500,
                height: 500,
                colorDark: "#000000",
                colorLight: "#ffffff",
                drawer: 'svg', 
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const svgElement = tempDiv.querySelector('svg');
                if (svgElement) {
                    const svgData = new XMLSerializer().serializeToString(svgElement);
                    const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
                    const url = URL.createObjectURL(svgBlob);
                    
                    const link = document.createElement('a');
                    link.download = 'qrcode.svg';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                } else {
                    alert('ไม่สามารถสร้างไฟล์ SVG ได้');
                }
            }, 300);
        }
    </script>
</body>
</html>
